# The repository's labels. scripts/labels.sh creates or updates them on GitHub.
# Each label is three lines in this order; the script reads exactly this shape.

- name: "type: bug"
  color: "d73a4a"
  description: "Something works differently from its docs, its rule or its help text"
- name: "type: data"
  color: "fbca04"
  description: "Something in the data looks wrong"
- name: "type: rule"
  color: "5319e7"
  description: "A change to how a rule works or to one of its values, or a new rule"
- name: "type: feature"
  color: "a2eeef"
  description: "Something Open Altio could do that it does not do yet"
- name: "type: docs"
  color: "0075ca"
  description: "The docs, a help text or a README"

- name: "area: pipeline"
  color: "c5def5"
  description: "Loading FDA's files and building a release"
- name: "area: rules"
  color: "c5def5"
  description: "The rule files, the rulebook and rules.toml"
- name: "area: explorer"
  color: "c5def5"
  description: "The explorer, its data API and How we clean FAERS"
- name: "area: cli"
  color: "c5def5"
  description: "The open-altio command"
- name: "area: docs"
  color: "c5def5"
  description: "The docs site and the READMEs"

- name: "status: needs-triage"
  color: "ededed"
  description: "New: a maintainer has not replied yet"
- name: "status: ready"
  color: "0e8a16"
  description: "Has acceptance criteria an agent can check"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on something else, which the issue names"

- name: "good first issue"
  color: "7057ff"
  description: "A small, well-described change, good for a first contribution"
- name: "help wanted"
  color: "008672"
  description: "We would welcome someone taking this on"
