site_name: Open Altio
site_description: FAERS cleaned and deduplicated in the open, with the code, the rules and the evidence for every step.
site_url: https://altio-ai.github.io/open-altio/
repo_url: https://github.com/Altio-AI/open-altio
repo_name: Altio-AI/open-altio
edit_uri: edit/main/docs/
copyright: Code Apache-2.0. FAERS data is published by the U.S. FDA.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Use:
      - Look at the data online: use/hosted.md
      - Run the explorer on your machine: use/explorer.md
      - FDA or Open Altio, reading the data: use/reading-the-data.md
  - Customise:
      - Rebuild from FDA's files: customise/rebuild.md
      - Change a rule: customise/rules.md
      - Make the groups file for the label flags: customise/label-groups.md
  - Contribute:
      - How to help: contribute/index.md
      - How the code fits together: contribute/architecture.md
      - Writing these docs: contribute/docs.md
  - Reference:
      - The open-altio command: reference/cli.md
      - Rule files: reference/rules.md
      - Data dictionary: reference/data-dictionary.md
  - Methods:
      - How we clean FAERS: methods/index.md
      - Case versions across AERS and FAERS: methods/case-versions.md
      - Duplicates across cases: methods/duplicates.md
      - The statistics: methods/statistics.md
      - Label phrases a person coded: methods/label-review.md
      - How we clean FAERS on open.altioai.com: https://open.altioai.com/methods
